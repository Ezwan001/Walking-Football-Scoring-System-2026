        let matchesData = [];

        function showTab(categoryId) {
            document.querySelectorAll('.category-content').forEach(el => el.classList.add('hidden'));
            const contentEl = document.getElementById('content-' + categoryId);
            if(contentEl) contentEl.classList.remove('hidden');
            
            document.querySelectorAll('.tab-btn').forEach(el => {
                el.className = "tab-btn flex-1 py-3 px-4 rounded-lg font-bold text-center transition hover:bg-gray-50 text-gray-500";
            });
            
            const activeTab = document.getElementById('tab-' + categoryId);
            if(activeTab) {
                activeTab.className = "tab-btn flex-1 py-3 px-4 rounded-lg font-bold text-center transition bg-blue-100 text-blue-800 shadow-sm border-b-2 border-blue-600";
            }
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    alert(`Ralat skrin penuh: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        function parseCSV(text) {
            const lines = text.split('\n').map(line => line.trim()).filter(line => line.length > 0);
            const headers = lines[0].split(',').map(h => h.trim());
            
            const data = [];
            for (let i = 1; i < lines.length; i++) {
                // Handle commas inside quotes if any, tapi untuk fail ringkas kita split biasa sudah memadai
                const values = lines[i].split(',');
                let row = {};
                headers.forEach((header, index) => {
                    row[header] = values[index] ? values[index].trim() : "";
                });
                data.push(row);
            }
            return data;
        }

        async function fetchData() {
            try {
                const url = CSV_URL + "&t=" + new Date().getTime(); 
                const response = await fetch(url);
                if (!response.ok) throw new Error("Network response was not ok");
                
                const text = await response.text();
                matchesData = parseCSV(text);
                
                document.getElementById('loading').classList.add('hidden');
                
                renderCategory('Lelaki', 'Lelaki KOSPEN');
                renderCategory('Wanita Kumpulan A', 'Wanita Kumpulan A');
                renderCategory('Wanita Kumpulan B', 'Wanita Kumpulan B');

                const allHidden = Array.from(document.querySelectorAll('.category-content')).every(el => el.classList.contains('hidden'));
                if (allHidden) showTab('Lelaki');

                const now = new Date();
                document.getElementById('last-updated').innerText = `Dikemaskini: ${now.toLocaleTimeString()}`;
                
            } catch (error) {
                console.error("Error fetching data:", error);
                // Hanya tunjuk ralat jika data kosong sama sekali
                if (matchesData.length === 0) {
                    document.getElementById('loading').innerHTML = `
                        <div class="bg-red-100 text-red-700 p-6 rounded-xl border border-red-200">
                            <i class="fas fa-exclamation-triangle text-4xl mb-3"></i>
                            <h3 class="font-bold text-xl mb-1">Gagal Memuat Turun Data</h3>
                            <p class="text-sm opacity-90">Sila pastikan link Google Sheets adalah betul.</p>
                        </div>
                    `;
                }
            }
        }

        function calculateStandings(matches) {
            let teams = {};

            matches.forEach(m => {
                const t1 = m['Pasukan 1'];
                const t2 = m['Pasukan 2'];
                if(t1 && !teams[t1]) teams[t1] = { name: t1, p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0 };
                if(t2 && !teams[t2]) teams[t2] = { name: t2, p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0 };
            });

            matches.forEach(m => {
                if (m['Status'] && m['Status'].toLowerCase() === 'selesai' && m['Skor 1'] !== "" && m['Skor 2'] !== "") {
                    const t1 = m['Pasukan 1'];
                    const t2 = m['Pasukan 2'];
                    const s1 = parseInt(m['Skor 1']);
                    const s2 = parseInt(m['Skor 2']);

                    if(teams[t1] && teams[t2]) {
                        teams[t1].p++; teams[t2].p++;
                        teams[t1].gf += s1; teams[t2].gf += s2;
                        teams[t1].ga += s2; teams[t2].ga += s1;

                        if (s1 > s2) {
                            teams[t1].w++; teams[t1].pts += 3;
                            teams[t2].l++;
                        } else if (s1 < s2) {
                            teams[t2].w++; teams[t2].pts += 3;
                            teams[t1].l++;
                        } else {
                            teams[t1].d++; teams[t1].pts += 1;
                            teams[t2].d++; teams[t2].pts += 1;
                        }
                    }
                }
            });

            let standings = Object.values(teams).map(t => {
                t.gd = t.gf - t.ga;
                return t;
            });

            standings.sort((a, b) => {
                if (b.pts !== a.pts) return b.pts - a.pts;
                if (b.gd !== a.gd) return b.gd - a.gd;
                return b.gf - a.gf;
            });

            return standings;
        }

        function renderCategory(categoryKey, title) {
            const categoryMatches = matchesData.filter(m => m['Kategori'] === categoryKey);
            const standings = calculateStandings(categoryMatches);
            
            const container = document.getElementById('content-' + categoryKey);
            
            let html = `
                <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
                    
                    <!-- Table 1: Kedudukan -->
                    <div class="lg:col-span-7 bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden flex flex-col">
                        <div class="p-5 border-b border-gray-100 bg-gray-50 flex justify-between items-center">
                            <h2 class="text-xl font-bold text-gray-800"><i class="fas fa-trophy text-yellow-500 mr-2 text-2xl align-middle"></i> Kedudukan Kumpulan</h2>
                            <span class="text-xs font-medium text-blue-700 bg-blue-100 px-3 py-1 rounded-full border border-blue-200 hidden md:inline-block">
                                Kiraan Mata: Menang 3, Seri 1, Kalah 0
                            </span>
                        </div>
                        
                        <div class="overflow-x-auto table-container flex-grow p-4">
                            <table class="w-full text-sm text-left whitespace-nowrap">
                                <thead class="text-xs uppercase bg-blue-900 text-white rounded-lg">
                                    <tr>
                                        <th class="px-4 py-3 rounded-tl-lg text-center w-10">Ked</th>
                                        <th class="px-4 py-3">Pasukan</th>
                                        <th class="px-2 py-3 text-center" title="Perlawanan">P</th>
                                        <th class="px-2 py-3 text-center" title="Menang">M</th>
                                        <th class="px-2 py-3 text-center" title="Seri">S</th>
                                        <th class="px-2 py-3 text-center" title="Kalah">K</th>
                                        <th class="px-2 py-3 text-center" title="Jaringan">J</th>
                                        <th class="px-2 py-3 text-center" title="Bolos">B</th>
                                        <th class="px-2 py-3 text-center" title="Beza Gol">BG</th>
                                        <th class="px-4 py-3 text-center rounded-tr-lg font-extrabold text-yellow-300">MATA</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${standings.map((team, index) => `
                                        <tr class="border-b last:border-0 hover:bg-gray-50 transition ${index === 0 ? 'bg-yellow-50/50' : ''}">
                                            <td class="px-4 py-3 text-center font-bold text-gray-600">${index + 1}</td>
                                            <td class="px-4 py-3 font-bold text-gray-900 text-base">${team.name}</td>
                                            <td class="px-2 py-3 text-center font-medium">${team.p}</td>
                                            <td class="px-2 py-3 text-center text-green-600 font-bold">${team.w}</td>
                                            <td class="px-2 py-3 text-center text-gray-500 font-medium">${team.d}</td>
                                            <td class="px-2 py-3 text-center text-red-500 font-medium">${team.l}</td>
                                            <td class="px-2 py-3 text-center">${team.gf}</td>
                                            <td class="px-2 py-3 text-center">${team.ga}</td>
                                            <td class="px-2 py-3 text-center font-medium ${team.gd > 0 ? 'text-green-600' : (team.gd < 0 ? 'text-red-500' : '')}">${team.gd > 0 ? '+'+team.gd : team.gd}</td>
                                            <td class="px-4 py-3 text-center font-black text-xl text-blue-800 bg-blue-50/30">${team.pts}</td>
                                        </tr>
                                    `).join('')}
                                    ${standings.length === 0 ? `<tr><td colspan="10" class="text-center py-8 text-gray-500">Tiada data pasukan</td></tr>` : ''}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- Table 2: Jadual -->
                    <div class="lg:col-span-5 bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden flex flex-col">
                        <div class="p-5 border-b border-gray-100 bg-gray-50">
                            <h2 class="text-xl font-bold text-gray-800"><i class="fas fa-calendar-alt text-blue-500 mr-2 text-2xl align-middle"></i> Jadual & Keputusan</h2>
                        </div>
                        <div class="overflow-x-auto table-container flex-grow p-4">
                            <table class="w-full text-sm text-center whitespace-nowrap">
                                <thead class="text-xs uppercase bg-gray-100 text-gray-600">
                                    <tr>
                                        <th class="px-3 py-3 rounded-tl-lg w-12">No</th>
                                        <th class="px-3 py-3 text-right">Pasukan 1</th>
                                        <th class="px-3 py-3">Keputusan</th>
                                        <th class="px-3 py-3 text-left">Pasukan 2</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${categoryMatches.map(m => {
                                        const isSelesai = m['Status'] && m['Status'].toLowerCase() === 'selesai';
                                        const s1 = isSelesai && m['Skor 1'] !== "" ? m['Skor 1'] : '-';
                                        const s2 = isSelesai && m['Skor 2'] !== "" ? m['Skor 2'] : '-';
                                        
                                        let p1Class = "text-right font-medium text-gray-700";
                                        let p2Class = "text-left font-medium text-gray-700";
                                        
                                        let scoreDisplay = `<div class="inline-flex justify-center items-center px-4 py-1.5 bg-gray-100 text-gray-500 rounded-lg text-sm font-bold w-16 border border-gray-200">- : -</div>`;
                                        
                                        if (isSelesai) {
                                            scoreDisplay = `<div class="inline-flex justify-center items-center px-4 py-1.5 bg-blue-600 text-white shadow-sm rounded-lg text-base font-black w-20">${s1} : ${s2}</div>`;
                                            
                                            if (s1 !== '-' && s2 !== '-') {
                                                const ns1 = parseInt(s1);
                                                const ns2 = parseInt(s2);
                                                if (ns1 > ns2) p1Class = "text-right font-black text-gray-900";
                                                else if (ns2 > ns1) p2Class = "text-left font-black text-gray-900";
                                            }
                                        }

                                        return `
                                        <tr class="border-b last:border-0 hover:bg-gray-50">
                                            <td class="px-3 py-4 text-gray-400 font-medium">${m['No']}</td>
                                            <td class="px-3 py-4 ${p1Class}">${m['Pasukan 1']}</td>
                                            <td class="px-3 py-4">${scoreDisplay}</td>
                                            <td class="px-3 py-4 ${p2Class}">${m['Pasukan 2']}</td>
                                        </tr>
                                    `}).join('')}
                                    ${categoryMatches.length === 0 ? `<tr><td colspan="4" class="text-center py-8 text-gray-500">Tiada jadual ditemui</td></tr>` : ''}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
            if(container) container.innerHTML = html;
        }

        window.onload = () => {
            fetchData();
            // Refresh automatik dipercepatkan sikit sebab dah direct export (setiap 20 saat)
            setInterval(fetchData, 20000); 
        };
    </script>
</body>
</html>
