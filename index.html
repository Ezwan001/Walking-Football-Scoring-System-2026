<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Score KOSPEN 2026</title>
    
    <!-- Tailwind CSS untuk Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM (UMD) untuk komponen UI -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel standalone untuk membolehkan penulisan kod JSX (React) secara terus di dalam HTML -->
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

    <style>
        /* CSS Tambahan untuk sembunyikan scrollbar di bahagian Tab Menu (Mobile) */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* Animasi */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
    </style>
</head>
<body class="bg-gray-50 font-sans antialiased text-gray-900 selection:bg-green-200">
    <!-- Div utama di mana aplikasi React akan dimasukkan -->
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback } = React;

        // Koleksi Ikon SVG Kustom (Digunakan agar tidak perlu import dari luar)
        const SoccerIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <circle cx="12" cy="12" r="10" />
                <polygon points="12 7.5 8.5 10 10 14.5 14 14.5 15.5 10" />
                <path d="M12 7.5V2M8.5 10L3 9M15.5 10L21 9M10 14.5L7 20M14 14.5L17 20" />
            </svg>
        );

        const CalendarIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
                <line x1="16" y1="2" x2="16" y2="6" />
                <line x1="8" y1="2" x2="8" y2="6" />
                <line x1="3" y1="10" x2="21" y2="10" />
            </svg>
        );

        const UsersIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                <circle cx="9" cy="7" r="4" />
                <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
                <path d="M16 3.13a4 4 0 0 1 0 7.75" />
            </svg>
        );

        const TrophyIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6" />
                <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18" />
                <path d="M4 22h16" />
                <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22" />
                <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22" />
                <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z" />
            </svg>
        );

        const MedalIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M7.21 15 2.66 7.14a2 2 0 0 1 .13-2.2L4.4 2.8A2 2 0 0 1 6 2h12a2 2 0 0 1 1.6.8l1.6 2.14a2 2 0 0 1 .14 2.2L16.79 15" />
                <path d="M11 12 5.12 2.2" />
                <path d="m13 12 5.88-9.8" />
                <path d="M8 7h8" />
                <circle cx="12" cy="17" r="5" />
                <path d="M12 18v-2h-.5" />
            </svg>
        );

        const RefreshIcon = ({ className, isLoading }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={`${className} ${isLoading ? 'animate-spin' : ''}`}>
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                <path d="M3 3v5h5" />
            </svg>
        );

        const MaximizeIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M8 3H5a2 2 0 0 0-2 2v3" />
                <path d="M21 8V5a2 2 0 0 0-2-2h-3" />
                <path d="M3 16v3a2 2 0 0 0 2 2h3" />
                <path d="M16 21h3a2 2 0 0 0 2-2v-3" />
            </svg>
        );

        const MinimizeIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M8 3v3a2 2 0 0 1-2 2H3" />
                <path d="M21 8h-3a2 2 0 0 1-2-2V3" />
                <path d="M3 16h3a2 2 0 0 1 2 2v3" />
                <path d="M16 21v-3a2 2 0 0 1 2-2h3" />
            </svg>
        );

        // Pautan Eksport Google Sheets ke CSV
        const GOOGLE_SHEETS_CSV_URL = "https://docs.google.com/spreadsheets/d/1RGvmTg4T37dapx5uNoslsbEu30XAiAVRH4KCGvx0Bz4/gviz/tq?tqx=out:csv";

        const MEN_TEAMS = ["Kota Setar (L)", "Kuala Muda (L)", "Langkawi (L)", "Pendang (L)", "Sik (L)"];
        const WOMEN_GROUP_A_TEAMS = ["Kubang Pasu (W1)", "Kulim (W1)", "Baling (W1)", "Langkawi (W)", "Bandar Baharu (W)", "Sik (W1)"];
        const WOMEN_GROUP_B_TEAMS = ["Kota Setar (W)", "Pendang (W)", "Kubang Pasu (W2)", "Kulim (W2)", "Baling (W2)", "Sik (W2)"];

        // Struktur Awal Jadual Perlawanan (Mengikut urutan gambar)
        const INITIAL_MATCHES = [
            // LELAKI (10 Matches)
            { id: 'l1', group: 'LELAKI', homeTeam: 'Kota Setar (L)', awayTeam: 'Pendang (L)' },
            { id: 'l2', group: 'LELAKI', homeTeam: 'Kuala Muda (L)', awayTeam: 'Langkawi (L)' },
            { id: 'l3', group: 'LELAKI', homeTeam: 'Kota Setar (L)', awayTeam: 'Sik (L)' },
            { id: 'l4', group: 'LELAKI', homeTeam: 'Langkawi (L)', awayTeam: 'Pendang (L)' },
            { id: 'l5', group: 'LELAKI', homeTeam: 'Kota Setar (L)', awayTeam: 'Kuala Muda (L)' },
            { id: 'l6', group: 'LELAKI', homeTeam: 'Pendang (L)', awayTeam: 'Sik (L)' },
            { id: 'l7', group: 'LELAKI', homeTeam: 'Kota Setar (L)', awayTeam: 'Langkawi (L)' },
            { id: 'l8', group: 'LELAKI', homeTeam: 'Pendang (L)', awayTeam: 'Kuala Muda (L)' },
            { id: 'l9', group: 'LELAKI', homeTeam: 'Sik (L)', awayTeam: 'Langkawi (L)' },
            { id: 'l10', group: 'LELAKI', homeTeam: 'Kuala Muda (L)', awayTeam: 'Sik (L)' },

            // WANITA KUMPULAN A (9 matches - Setiap pasukan beraksi 3 kali)
            { id: 'wa1', group: 'WANITA_A', homeTeam: 'Kubang Pasu (W1)', awayTeam: 'Kulim (W1)' },
            { id: 'wa2', group: 'WANITA_A', homeTeam: 'Baling (W1)', awayTeam: 'Langkawi (W)' },
            { id: 'wa3', group: 'WANITA_A', homeTeam: 'Bandar Baharu (W)', awayTeam: 'Kubang Pasu (W1)' },
            { id: 'wa4', group: 'WANITA_A', homeTeam: 'Baling (W1)', awayTeam: 'Sik (W1)' },
            { id: 'wa5', group: 'WANITA_A', homeTeam: 'Bandar Baharu (W)', awayTeam: 'Langkawi (W)' },
            { id: 'wa6', group: 'WANITA_A', homeTeam: 'Sik (W1)', awayTeam: 'Kulim (W1)' },
            { id: 'wa7', group: 'WANITA_A', homeTeam: 'Kubang Pasu (W1)', awayTeam: 'Baling (W1)' },
            { id: 'wa8', group: 'WANITA_A', homeTeam: 'Bandar Baharu (W)', awayTeam: 'Sik (W1)' },
            { id: 'wa9', group: 'WANITA_A', homeTeam: 'Langkawi (W)', awayTeam: 'Kulim (W1)' },

            // WANITA KUMPULAN B (9 matches - Setiap pasukan beraksi 3 kali)
            { id: 'wb1', group: 'WANITA_B', homeTeam: 'Kota Setar (W)', awayTeam: 'Pendang (W)' },
            { id: 'wb2', group: 'WANITA_B', homeTeam: 'Kubang Pasu (W2)', awayTeam: 'Kulim (W2)' },
            { id: 'wb3', group: 'WANITA_B', homeTeam: 'Baling (W2)', awayTeam: 'Pendang (W)' },
            { id: 'wb4', group: 'WANITA_B', homeTeam: 'Kota Setar (W)', awayTeam: 'Kubang Pasu (W2)' },
            { id: 'wb5', group: 'WANITA_B', homeTeam: 'Baling (W2)', awayTeam: 'Sik (W2)' },
            { id: 'wb6', group: 'WANITA_B', homeTeam: 'Sik (W2)', awayTeam: 'Kulim (W2)' },
            { id: 'wb7', group: 'WANITA_B', homeTeam: 'Kota Setar (W)', awayTeam: 'Baling (W2)' },
            { id: 'wb8', group: 'WANITA_B', homeTeam: 'Kubang Pasu (W2)', awayTeam: 'Sik (W2)' },
            { id: 'wb9', group: 'WANITA_B', homeTeam: 'Pendang (W)', awayTeam: 'Kulim (W2)' },
        ].map(match => ({
            ...match,
            homeScore: '',
            awayScore: '',
            isPlayed: false
        }));

        const INITIAL_KNOCKOUT = {
            third: { homeScore: '', awayScore: '', isPlayed: false },
            final: { homeScore: '', awayScore: '', isPlayed: false }
        };

        // Fungsi Parser CSV Ringkas (Serasi dengan Babel 6)
        const parseCSV = (str) => {
            const arr = [];
            let quote = false;
            let row = 0, col = 0;
            for (let c = 0; c < str.length; c++) {
                let cc = str[c], nc = str[c + 1];
                arr[row] = arr[row] || [];
                arr[row][col] = arr[row][col] || '';
                if (cc === '"' && quote && nc === '"') { arr[row][col] += cc; ++c; continue; }
                if (cc === '"') { quote = !quote; continue; }
                if (cc === ',' && !quote) { ++col; continue; }
                if (cc === '\r' && nc === '\n' && !quote) { ++row; col = 0; ++c; continue; }
                if (cc === '\n' && !quote) { ++row; col = 0; continue; }
                if (cc === '\r' && !quote) { ++row; col = 0; continue; }
                arr[row][col] += cc;
            }
            return arr;
        };

        // Fungsi Mengira Kedudukan Semasa
        const calculateStandings = (teams, matches) => {
            const standings = teams.map(team => ({
                team: team, P: 0, M: 0, S: 0, K: 0, J: 0, B: 0, BZ: 0, Mata: 0
            }));

            matches.forEach(match => {
                if (match.isPlayed) {
                    const home = standings.find(s => s.team === match.homeTeam);
                    const away = standings.find(s => s.team === match.awayTeam);
                    
                    if (home && away) {
                        const homeGoals = parseInt(match.homeScore, 10) || 0;
                        const awayGoals = parseInt(match.awayScore, 10) || 0;

                        home.P += 1; away.P += 1;
                        home.J += homeGoals; home.B += awayGoals;
                        away.J += awayGoals; away.B += homeGoals;

                        if (homeGoals > awayGoals) {
                            home.M += 1; home.Mata += 3; away.K += 1;
                        } else if (homeGoals < awayGoals) {
                            away.M += 1; away.Mata += 3; home.K += 1;
                        } else {
                            home.S += 1; away.S += 1; home.Mata += 1; away.Mata += 1;
                        }
                    }
                }
            });

            standings.forEach(s => { s.BZ = s.J - s.B; });
            
            standings.sort((a, b) => {
                if (b.Mata !== a.Mata) return b.Mata - a.Mata;
                if (b.BZ !== a.BZ) return b.BZ - a.BZ;
                if (b.J !== a.J) return b.J - a.J;
                return a.team.localeCompare(b.team);
            });

            return standings;
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('LELAKI');
            const [matches, setMatches] = useState(INITIAL_MATCHES);
            const [knockout, setKnockout] = useState(INITIAL_KNOCKOUT);
            const [isLoading, setIsLoading] = useState(true);
            const [lastUpdate, setLastUpdate] = useState('');
            const [isFullscreen, setIsFullscreen] = useState(false);

            // Handler Skrin Penuh
            useEffect(() => {
                const handleFullscreenChange = () => setIsFullscreen(!!document.fullscreenElement);
                document.addEventListener('fullscreenchange', handleFullscreenChange);
                return () => document.removeEventListener('fullscreenchange', handleFullscreenChange);
            }, []);

            const toggleFullscreen = () => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch((err) => {
                        console.warn('Fullscreen unavailable:', err);
                        alert("Pelayar anda tidak menyokong fungsi Skrin Penuh di tetingkap ini.");
                    });
                } else {
                    if (document.exitFullscreen) document.exitFullscreen();
                }
            };

            const fetchScores = useCallback(async () => {
                setIsLoading(true);
                try {
                    // Penambahan timestamp untuk mengelak cache browser
                    const response = await fetch(GOOGLE_SHEETS_CSV_URL + "&_t=" + new Date().getTime());
                    if (!response.ok) throw new Error("Gagal menyambung ke pangkalan data");
                    
                    const text = await response.text();
                    const rows = parseCSV(text);

                    let updatedMatches = [...INITIAL_MATCHES];
                    let updatedKnockout = { ...INITIAL_KNOCKOUT };

                    for (let i = 1; i < rows.length; i++) {
                        const row = rows[i];
                        if (!row || row.length < 6) continue; 
                        
                        // Cara selamat membaca array tanpa '?.' (Sesuai Babel 6)
                        const category = row[0] ? row[0].trim() : '';
                        const p1 = row[2] ? row[2].trim() : '';
                        const s1 = row[3] ? row[3].trim() : '';
                        const s2 = row[4] ? row[4].trim() : '';
                        const p2 = row[5] ? row[5].trim() : '';

                        const hasScore = s1 !== '' && s2 !== '';

                        // Kemaskini perlawanan kumpulan
                        const matchIndex = updatedMatches.findIndex(m => 
                            (m.homeTeam === p1 && m.awayTeam === p2) || 
                            (m.homeTeam === p2 && m.awayTeam === p1)
                        );

                        if (matchIndex !== -1) {
                            if (updatedMatches[matchIndex].homeTeam === p1) {
                                updatedMatches[matchIndex].homeScore = hasScore ? s1 : '';
                                updatedMatches[matchIndex].awayScore = hasScore ? s2 : '';
                            } else {
                                updatedMatches[matchIndex].homeScore = hasScore ? s2 : '';
                                updatedMatches[matchIndex].awayScore = hasScore ? s1 : '';
                            }
                            updatedMatches[matchIndex].isPlayed = hasScore;
                        }

                        // Kemaskini perlawanan kalah mati (Jika direkod di google sheets)
                        if (category && category.toLowerCase().includes('wanita final')) {
                            if (p1.toLowerCase().includes('ketiga') || category.toLowerCase().includes('ketiga')) {
                                updatedKnockout.third.homeScore = hasScore ? s1 : '';
                                updatedKnockout.third.awayScore = hasScore ? s2 : '';
                                updatedKnockout.third.isPlayed = hasScore;
                            } else {
                                updatedKnockout.final.homeScore = hasScore ? s1 : '';
                                updatedKnockout.final.awayScore = hasScore ? s2 : '';
                                updatedKnockout.final.isPlayed = hasScore;
                            }
                        }
                    }

                    setMatches(updatedMatches);
                    setKnockout(updatedKnockout);
                    
                    const now = new Date();
                    setLastUpdate(now.toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit', second: '2-digit' }));

                } catch (error) {
                    console.error("Sync Error:", error);
                } finally {
                    setIsLoading(false);
                }
            }, []);

            // Auto-refresh setiap 30 saat
            useEffect(() => {
                fetchScores();
                const interval = setInterval(() => { fetchScores(); }, 30000);
                return () => clearInterval(interval);
            }, [fetchScores]);

            const womenAStandings = useMemo(() => 
                calculateStandings(WOMEN_GROUP_A_TEAMS, matches.filter(m => m.group === 'WANITA_A')),
            [matches]);
            
            const womenBStandings = useMemo(() => 
                calculateStandings(WOMEN_GROUP_B_TEAMS, matches.filter(m => m.group === 'WANITA_B')),
            [matches]);

            // Final: Tempat 1 Kump A vs Tempat 1 Kump B
            const finalHome = (womenAStandings[0] && womenAStandings[0].P > 0) ? womenAStandings[0].team : "Menunggu Juara Kump. A";
            const finalAway = (womenBStandings[0] && womenBStandings[0].P > 0) ? womenBStandings[0].team : "Menunggu Juara Kump. B";
            
            // Tempat Ketiga: Tempat 2 Kump A vs Tempat 2 Kump B
            const thirdHome = (womenAStandings[1] && womenAStandings[1].P > 0) ? womenAStandings[1].team : "Menunggu Tempat ke-2 A";
            const thirdAway = (womenBStandings[1] && womenBStandings[1].P > 0) ? womenBStandings[1].team : "Menunggu Tempat ke-2 B";

            const getWinner = (match, homeName, awayName) => {
                if (!match.isPlayed) return "TBC";
                const h = parseInt(match.homeScore, 10);
                const a = parseInt(match.awayScore, 10);
                if (h > a) return homeName;
                if (a > h) return awayName;
                return "TBC (Seri)";
            };

            const getLoser = (match, homeName, awayName) => {
                if (!match.isPlayed) return "TBC";
                const h = parseInt(match.homeScore, 10);
                const a = parseInt(match.awayScore, 10);
                if (h < a) return homeName;
                if (a < h) return awayName;
                return "TBC (Seri)";
            };

            const StandingTable = ({ title, teams, groupMatches }) => {
                const standings = calculateStandings(teams, groupMatches);
                return (
                    <div className="bg-white rounded-xl shadow-md border border-gray-100 overflow-hidden mt-8 mb-6 fade-in">
                        <div className="bg-green-700 px-6 py-4 border-b-4 border-yellow-400 flex flex-col md:flex-row md:items-center justify-between gap-3">
                            <div className="flex items-center gap-3">
                                <TrophyIcon className="w-6 h-6 text-yellow-400" />
                                <h2 className="text-xl font-bold text-white uppercase tracking-wider">{title}</h2>
                            </div>
                            <div className="text-xs text-green-100 bg-green-800 px-3 py-1.5 rounded-lg border border-green-600 inline-block font-medium shadow-inner">
                                Menang: <span className="text-yellow-400 font-bold">3 Poin</span> | 
                                Seri: <span className="text-yellow-400 font-bold">1 Poin</span> | 
                                Kalah: <span className="text-yellow-400 font-bold">0 Poin</span>
                            </div>
                        </div>
                        <div className="overflow-x-auto">
                            <table className="w-full text-sm text-left">
                                <thead className="text-xs text-gray-700 uppercase bg-green-50 border-b border-green-200">
                                    <tr>
                                        <th className="px-4 py-4 text-center font-bold text-green-900 w-12">No</th>
                                        <th className="px-4 py-4 font-bold text-green-900">Pasukan</th>
                                        <th className="px-3 py-4 text-center text-green-900" title="Perlawanan">P</th>
                                        <th className="px-3 py-4 text-center text-green-900" title="Menang">M</th>
                                        <th className="px-3 py-4 text-center text-green-900" title="Seri">S</th>
                                        <th className="px-3 py-4 text-center text-green-900" title="Kalah">K</th>
                                        <th className="px-3 py-4 text-center text-green-900 hidden sm:table-cell" title="Jaringan">GF</th>
                                        <th className="px-3 py-4 text-center text-green-900 hidden sm:table-cell" title="Bolos">GA</th>
                                        <th className="px-3 py-4 text-center text-green-900" title="Beza Gol">GD</th>
                                        <th className="px-4 py-4 text-center text-green-800 font-black text-base w-16">Pts</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {standings.map((row, index) => (
                                        <tr key={row.team} className="bg-white border-b border-gray-100 hover:bg-green-50/40 transition-colors">
                                            <td className="px-4 py-3 text-center font-semibold text-gray-500">{index + 1}</td>
                                            <td className="px-4 py-3 font-bold text-gray-800">{row.team}</td>
                                            <td className="px-3 py-3 text-center font-medium bg-gray-50">{row.P}</td>
                                            <td className="px-3 py-3 text-center text-green-600 font-semibold">{row.M}</td>
                                            <td className="px-3 py-3 text-center text-gray-500 font-semibold">{row.S}</td>
                                            <td className="px-3 py-3 text-center text-red-500 font-semibold">{row.K}</td>
                                            <td className="px-3 py-3 text-center bg-gray-50 hidden sm:table-cell">{row.J}</td>
                                            <td className="px-3 py-3 text-center bg-gray-50 hidden sm:table-cell">{row.B}</td>
                                            <td className="px-3 py-3 text-center font-semibold">{row.BZ > 0 ? `+${row.BZ}` : row.BZ}</td>
                                            <td className="px-4 py-3 text-center font-black text-green-800 bg-green-100/50 text-base">{row.Mata}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                );
            };

            const MatchRowReadonly = ({ match, index }) => (
                <div className={`flex flex-col sm:flex-row items-center justify-between p-4 rounded-xl border-2 transition-all ${match.isPlayed ? 'bg-gray-50/80 border-gray-200' : 'bg-white border-gray-100 shadow-sm hover:border-green-300 hover:shadow-md'}`}>
                    
                    <div className="flex w-full sm:w-auto justify-between mb-3 sm:mb-0">
                        <div className="text-green-700/50 font-black w-8 text-lg hidden sm:block">{index + 1}.</div>
                        <div className="sm:hidden text-green-700/50 font-black text-sm">Perlawanan {index + 1}</div>
                        <div className="sm:hidden">
                            <span className={`text-[10px] font-bold px-2 py-1 rounded border uppercase ${match.isPlayed ? 'bg-gray-100 text-gray-500 border-gray-200' : 'bg-green-50 text-green-600 border-green-200'}`}>
                                {match.isPlayed ? 'Tamat' : 'Belum'}
                            </span>
                        </div>
                    </div>

                    <div className="flex-1 w-full flex items-center justify-between sm:justify-end gap-3 sm:gap-6 sm:pr-8">
                        <span className={`font-bold text-sm sm:text-base text-right flex-1 ${match.isPlayed ? 'text-gray-500' : 'text-gray-800'}`}>{match.homeTeam}</span>
                        <div className={`w-14 h-12 flex items-center justify-center text-xl sm:text-2xl font-bold rounded-lg border-2 ${match.isPlayed ? 'bg-white border-green-300 text-green-700 shadow-sm' : 'bg-gray-50 border-gray-200 text-gray-400'}`}>
                            {match.isPlayed ? match.homeScore : '-'}
                        </div>
                    </div>
                    
                    <div className="text-[10px] sm:text-xs font-black text-gray-400 bg-gray-200 px-3 py-1 rounded-full whitespace-nowrap my-3 sm:my-0">VS</div>
                    
                    <div className="flex-1 w-full flex items-center justify-between sm:justify-start gap-3 sm:gap-6 sm:pl-8">
                        <div className={`w-14 h-12 flex items-center justify-center text-xl sm:text-2xl font-bold rounded-lg border-2 ${match.isPlayed ? 'bg-white border-green-300 text-green-700 shadow-sm' : 'bg-gray-50 border-gray-200 text-gray-400'}`}>
                            {match.isPlayed ? match.awayScore : '-'}
                        </div>
                        <span className={`font-bold text-sm sm:text-base text-left flex-1 ${match.isPlayed ? 'text-gray-500' : 'text-gray-800'}`}>{match.awayTeam}</span>
                    </div>

                    <div className="hidden sm:flex w-24 justify-end ml-4">
                        <span className={`text-[10px] font-bold px-2 py-1 rounded border uppercase tracking-wider ${match.isPlayed ? 'bg-gray-100 text-gray-500 border-gray-200' : 'bg-green-50 text-green-600 border-green-200'}`}>
                            {match.isPlayed ? 'Tamat' : 'Belum'}
                        </span>
                    </div>
                </div>
            );

            const KnockoutCard = ({ title, data, homeTeam, awayTeam, isFinal, subtitle }) => (
                <div className={`rounded-2xl border-2 overflow-hidden shadow-lg bg-white ${isFinal ? 'border-yellow-400 shadow-yellow-100/50' : 'border-green-600'}`}>
                    <div className={`px-5 py-4 text-center border-b-2 ${isFinal ? 'bg-gradient-to-r from-yellow-400 to-yellow-500 text-yellow-900 border-yellow-600' : 'bg-gradient-to-r from-green-600 to-green-700 text-white border-green-800'}`}>
                        <h3 className="font-black text-lg tracking-wide uppercase drop-shadow-sm">{title}</h3>
                        {subtitle && <p className={`text-xs font-bold mt-1 ${isFinal ? 'text-yellow-900/80' : 'text-green-100'}`}>{subtitle}</p>}
                    </div>
                    
                    <div className="p-6">
                        <div className="flex flex-col md:flex-row items-center justify-between gap-6">
                            <div className="flex-1 w-full text-center md:text-right bg-gray-50 p-5 rounded-xl border border-gray-100 shadow-inner">
                                <span className="font-bold text-gray-800 text-lg block mb-4">{homeTeam}</span>
                                <div className={`inline-flex items-center justify-center w-20 h-16 text-3xl font-black rounded-lg border-2 ${data.isPlayed ? 'bg-white border-green-400 text-green-700 shadow-sm' : 'bg-gray-100 border-gray-200 text-gray-400'}`}>
                                    {data.isPlayed ? data.homeScore : '-'}
                                </div>
                            </div>
                            
                            <div className="flex flex-col items-center justify-center shrink-0">
                                <div className="w-10 h-10 rounded-full bg-gray-800 flex items-center justify-center shadow-md">
                                    <span className="text-sm font-black text-white">VS</span>
                                </div>
                            </div>
                            
                            <div className="flex-1 w-full text-center md:text-left bg-gray-50 p-5 rounded-xl border border-gray-100 shadow-inner">
                                <span className="font-bold text-gray-800 text-lg block mb-4">{awayTeam}</span>
                                <div className={`inline-flex items-center justify-center w-20 h-16 text-3xl font-black rounded-lg border-2 ${data.isPlayed ? 'bg-white border-green-400 text-green-700 shadow-sm' : 'bg-gray-100 border-gray-200 text-gray-400'}`}>
                                    {data.isPlayed ? data.awayScore : '-'}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen flex flex-col relative pb-20 bg-gray-100/50">
                    
                    <header className="bg-green-800 shadow-lg relative overflow-hidden border-b-4 border-yellow-400">
                        <div className="absolute top-0 right-0 p-4 opacity-[0.05] pointer-events-none transform translate-x-10 -translate-y-10">
                            <SoccerIcon className="w-64 h-64 text-white" />
                        </div>
                        
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
                            <div className="flex flex-col sm:flex-row items-center justify-between py-6 gap-4">
                                
                                <div className="flex items-center gap-5">
                                    <div className="w-16 h-16 bg-white rounded-full flex items-center justify-center shadow-xl border-4 border-yellow-400 shrink-0">
                                        <SoccerIcon className="w-9 h-9 text-green-700" />
                                    </div>
                                    <div>
                                        <div className="flex items-center gap-3">
                                            <h1 className="text-3xl sm:text-4xl font-black text-white tracking-tight leading-none drop-shadow-md">KOSPEN 2026</h1>
                                            <span className="bg-red-500 text-white text-[10px] sm:text-xs font-black px-2.5 py-0.5 rounded uppercase tracking-wider animate-pulse border border-red-400 shadow-sm">Live</span>
                                        </div>
                                        <p className="text-yellow-400 text-[11px] sm:text-xs font-bold mt-2 uppercase tracking-widest bg-green-900/60 inline-block px-3 py-1 rounded-full shadow-inner border border-green-700/50">Sistem Skor Walking Football</p>
                                    </div>
                                </div>
                                
                                <div className="flex items-center gap-3">
                                    <div className="flex flex-col items-end bg-green-900/60 px-4 py-2 rounded-xl border border-green-700/50 backdrop-blur-sm shadow-inner">
                                        <button 
                                            onClick={fetchScores}
                                            disabled={isLoading}
                                            className="flex items-center gap-2 text-white hover:text-yellow-400 transition-colors font-bold text-sm mb-0.5 disabled:opacity-50"
                                        >
                                            <RefreshIcon className="w-4 h-4" isLoading={isLoading} />
                                            {isLoading ? 'Syncing...' : 'Muat Semula'}
                                        </button>
                                        <div className="text-[10px] text-green-200/80 font-medium whitespace-nowrap">
                                            Kemaskini: {lastUpdate || '-'}
                                        </div>
                                    </div>

                                    <button 
                                        onClick={toggleFullscreen}
                                        className="flex items-center justify-center w-12 h-12 bg-green-900/60 hover:bg-green-700 text-white rounded-xl transition-colors border border-green-700/50 backdrop-blur-sm shadow-inner"
                                        title={isFullscreen ? "Keluar Skrin Penuh" : "Skrin Penuh"}
                                    >
                                        {isFullscreen ? <MinimizeIcon className="w-5 h-5" /> : <MaximizeIcon className="w-5 h-5" />}
                                    </button>
                                </div>

                            </div>
                        </div>
                    </header>

                    {/* Menu Navigasi Tab */}
                    <div className="bg-white border-b border-gray-200 shadow-sm sticky top-0 z-40">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <nav className="flex space-x-1 sm:space-x-4 overflow-x-auto no-scrollbar" aria-label="Tabs">
                                {[
                                    { id: 'LELAKI', label: 'KATEGORI LELAKI' },
                                    { id: 'WANITA_A', label: 'KATEGORI WANITA (KUMP. A)' },
                                    { id: 'WANITA_B', label: 'KATEGORI WANITA (KUMP. B)' },
                                    { id: 'WANITA_FINAL', label: 'WANITA (FINAL)' }
                                ].map(tab => (
                                    <button
                                        key={tab.id}
                                        onClick={() => {
                                            setActiveTab(tab.id);
                                            window.scrollTo({ top: 0, behavior: 'smooth' });
                                        }}
                                        className={`flex items-center gap-2 py-4 px-4 sm:px-6 border-b-4 font-black text-xs sm:text-sm tracking-wider transition-all whitespace-nowrap ${
                                            activeTab === tab.id
                                                ? tab.id === 'WANITA_FINAL' 
                                                    ? 'border-yellow-400 text-green-900 bg-yellow-50' 
                                                    : 'border-green-600 text-green-800 bg-green-50'
                                                : 'border-transparent text-gray-500 hover:text-green-700 hover:bg-gray-50'
                                        }`}
                                    >
                                        {tab.id === 'WANITA_FINAL' ? (
                                            <MedalIcon className={`w-4 h-4 sm:w-5 sm:h-5 ${activeTab === tab.id ? 'text-yellow-500' : 'text-gray-400'}`} />
                                        ) : (
                                            <UsersIcon className={`w-4 h-4 sm:w-5 sm:h-5 ${activeTab === tab.id ? 'text-green-600' : 'text-gray-400'}`} />
                                        )}
                                        {tab.label}
                                    </button>
                                ))}
                            </nav>
                        </div>
                    </div>

                    <main className="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
                        
                        {/* PAPARAN KUMPULAN */}
                        {activeTab !== 'WANITA_FINAL' && (
                            <div className="space-y-10">
                                
                                <div className="bg-white rounded-xl shadow-md border border-gray-100 overflow-hidden fade-in">
                                    <div className="bg-yellow-500 px-6 py-4 border-b-4 border-yellow-600">
                                        <div className="flex items-center gap-3">
                                            <CalendarIcon className="w-6 h-6 text-yellow-900" />
                                            <h2 className="text-xl font-bold text-yellow-900 uppercase tracking-wider drop-shadow-sm">Jadual Perlawanan</h2>
                                        </div>
                                    </div>
                                    <div className="p-4 sm:p-6 grid gap-4 bg-gray-50/50">
                                        {matches.filter(m => m.group === activeTab).map((match, idx) => (
                                            <MatchRowReadonly key={match.id} match={match} index={idx} />
                                        ))}
                                    </div>
                                </div>

                                <StandingTable 
                                    title="Jadual Kedudukan" 
                                    teams={activeTab === 'LELAKI' ? MEN_TEAMS : activeTab === 'WANITA_A' ? WOMEN_GROUP_A_TEAMS : WOMEN_GROUP_B_TEAMS} 
                                    groupMatches={matches.filter(m => m.group === activeTab)} 
                                />
                            </div>
                        )}

                        {/* PAPARAN FINAL WANITA */}
                        {activeTab === 'WANITA_FINAL' && (
                            <div className="max-w-5xl mx-auto space-y-10 fade-in">
                                
                                <div className="grid md:grid-cols-2 gap-8 items-start">
                                    <KnockoutCard 
                                        title="Tempat Ketiga" data={knockout.third}
                                        homeTeam={thirdHome} awayTeam={thirdAway}
                                        subtitle="Naib Juara Kump. A vs Naib Juara Kump. B"
                                    />
                                    <KnockoutCard 
                                        title="Perlawanan Akhir (Juara)" data={knockout.final}
                                        homeTeam={finalHome} awayTeam={finalAway} isFinal={true}
                                        subtitle="Tempat Pertama Kump. A vs Tempat Pertama Kump. B"
                                    />
                                </div>
                                
                                <div className="bg-white p-8 rounded-2xl border-4 border-yellow-400 shadow-xl text-center relative overflow-hidden mt-12">
                                    <div className="absolute -bottom-10 -left-10 opacity-[0.03] pointer-events-none transform -rotate-12">
                                        <TrophyIcon className="w-96 h-96 text-yellow-900" />
                                    </div>
                                    
                                    <h3 className="font-black text-green-900 text-2xl sm:text-3xl mb-12 relative z-10 uppercase tracking-widest drop-shadow-sm border-b-2 border-green-100 pb-4 inline-block">
                                        Keputusan Rasmi Keseluruhan (Wanita)
                                    </h3>
                                    
                                    <div className="flex flex-col md:flex-row items-center justify-center gap-6 md:gap-8 relative z-10">
                                        <div className="flex flex-col items-center bg-gradient-to-b from-yellow-50 to-yellow-100 p-6 rounded-2xl border-2 border-yellow-400 w-full md:w-1/3 shadow-lg transform md:-translate-y-6">
                                            <div className="bg-yellow-400 p-4 rounded-full mb-4 shadow-inner ring-4 ring-yellow-200">
                                                <TrophyIcon className="w-12 h-12 text-yellow-900" />
                                            </div>
                                            <span className="text-sm font-black text-yellow-700 uppercase tracking-widest mb-2">Juara</span>
                                            <span className={`text-xl sm:text-2xl font-black text-center ${getWinner(knockout.final, finalHome, finalAway) === 'TBC' ? 'text-yellow-900/30' : 'text-green-900'}`}>
                                                {getWinner(knockout.final, finalHome, finalAway)}
                                            </span>
                                        </div>

                                        <div className="flex flex-col items-center bg-gradient-to-b from-gray-50 to-gray-100 p-6 rounded-2xl border-2 border-gray-300 w-full md:w-1/3 shadow-md">
                                            <div className="bg-gray-200 p-3 rounded-full mb-3 shadow-inner ring-4 ring-gray-100">
                                                <MedalIcon className="w-10 h-10 text-gray-500" />
                                            </div>
                                            <span className="text-sm font-black text-gray-500 uppercase tracking-widest mb-2">Naib Juara</span>
                                            <span className={`text-xl sm:text-2xl font-black text-center ${getLoser(knockout.final, finalHome, finalAway) === 'TBC' ? 'text-gray-400/50' : 'text-gray-800'}`}>
                                                {getLoser(knockout.final, finalHome, finalAway)}
                                            </span>
                                        </div>

                                        <div className="flex flex-col items-center bg-gradient-to-b from-amber-50 to-amber-100 p-6 rounded-2xl border-2 border-amber-300 w-full md:w-1/3 shadow-md md:translate-y-2">
                                            <div className="bg-amber-200 p-3 rounded-full mb-3 shadow-inner ring-4 ring-amber-100">
                                                <MedalIcon className="w-8 h-8 text-amber-700" />
                                            </div>
                                            <span className="text-sm font-black text-amber-700 uppercase tracking-widest mb-2">Tempat Ketiga</span>
                                            <span className={`text-lg sm:text-xl font-black text-center ${getWinner(knockout.third, thirdHome, thirdAway) === 'TBC' ? 'text-amber-900/30' : 'text-amber-900'}`}>
                                                {getWinner(knockout.third, thirdHome, thirdAway)}
                                            </span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    <footer className="mt-auto text-center py-6 text-gray-400 text-xs font-medium bg-white border-t border-gray-200 w-full">
                        <p>KOSPEN 2026 • Sistem Paparan Live Score Automatik</p>
                    </footer>
                </div>
            );
        };

        // Render to DOM
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
